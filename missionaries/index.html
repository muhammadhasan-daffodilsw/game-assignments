<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <title>Missionaries and Cannibals</title>
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>

</head> <body>
<div id="gameScreen">

    <div id="leftBank">
    </div>

    <div id="river">

    <div id="boat-container">
    <svg id="boat" width="100" height="60" viewBox="0 0 100 60">
        <path
            d="M10 25 L90 25 L75 45 L25 45 Z"
            fill="brown"
            stroke="black"
            stroke-width="2"
        />

        <line
            x1="50"
            y1="25"
            x2="50"
            y2="5"
            stroke="black"
            stroke-width="3"
        />

        <path
            d="M50 5 L70 15 L50 15 Z"
            fill="white"
            stroke="black"
        />
    </svg>

    <div id="passengers">
    </div>
</div>


</div>


    <div id="rightBank">
    </div>

</div>

<div id="controls">

    <button id="addMissionary">+ Missionary</button>
    <button id="removeMissionary">- Missionary</button>

    <button id="addCannibal">+ Cannibal</button>
    <button id="removeCannibal">- Cannibal</button>

    <button id="advanceTurn">Move Boat</button>

</div>

</body> </html>
